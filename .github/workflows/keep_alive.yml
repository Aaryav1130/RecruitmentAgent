name: Keep Streamlit Awake

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  ping_streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          
      - name: Visit Streamlit App with Headless Browser
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time
          
          def run(playwright):
              browser = playwright.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()
              
              print('Visiting Streamlit app...')
              page.goto('https://recruitmentagent-ijspeikrzlsn8iw7mxug5s.streamlit.app/', wait_until='networkidle')
              
              # Check if the app is asleep and click the wake up button if present
              try:
                  wake_button = page.get_by_text('Yes, get this app back up!')
                  if wake_button.is_visible(timeout=5000):
                      print('App is asleep! Clicking the wake up button...')
                      wake_button.click()
                      # Wait for the app to actually boot up (can take a minute)
                      page.wait_for_selector('.stApp', timeout=60000)
                      print('App successfully woken up!')
                  else:
                      print('App is already awake.')
              except Exception as e:
                  print('App is already awake (no sleep button found).')
              
              print('Waiting 15 seconds to simulate user activity and websocket connection...')
              time.sleep(15)
              
              print('Success! Streamlit sleep timer has been reset.')
              browser.close()
              
          with sync_playwright() as playwright:
              run(playwright)
          "
